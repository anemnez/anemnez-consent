[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2024"
repository = "https://github.com/anemnez/anemnez-consent"
license = "MIT OR Apache-2.0"
version = "0.1.0"
# Released to Artichoke only for now, like anemnez-extension and anemnez-secret.
publish = ["artichoke"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
